name: Release · 02 Deploy Clitools

on:
  workflow_run:
    workflows: ["Release · 01 Publish Packages"]
    types:
      - completed
    branches:
      - 'release/release-v*'

permissions:
  contents: read

# 同一 release 分支的部署串行执行；01 重跑完成后 02 自然跟上
concurrency:
  group: release-deploy-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  setup_environment:
    if: ${{ github.event.workflow_run.conclusion == 'success'}}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Switch to release branch
        id: switch_branch
        run: |
          git checkout ${{ github.event.workflow_run.head_branch }}
          echo "TARGET_BRANCH=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_ENV
          echo "Switched to branch: ${{ env.TARGET_BRANCH }}"

      - name: Extract version from branch name
        id: extract_version
        shell: bash
        run: |
          VERSION=$(echo "${{ github.event.workflow_run.head_branch }}" | grep -o 'v[0-9]*\.[0-9]*\.[0-9]*')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

    outputs:
      target_branch: ${{ env.TARGET_BRANCH }}
      version: ${{ env.VERSION }}

  # NOTE(v2.0.0 decision G3, supersedes v1.2 decision 0.4): Linux .deb/.rpm
  # packaging is formally REMOVED from the deploy chain (not repaired).
  # Rationale: ORT 1.19+ renamed the linux prebuilt package (gpu-cuda12 ->
  # gpu_cuda12) and changed the soname to libonnxruntime.so.1, so the deb
  # rules need a redesign nobody maintains; there is no Linux distribution
  # demand. Linux build+run support itself stays fully covered by
  # test-native.yml (ubuntu x86_64/aarch64 legs) and the manual smoke job.
  # The commented job below is kept as historical reference only.
  # deploy_linux:
  #   needs: setup_environment
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout release
  #       uses: actions/checkout@v4
  #       with:
  #         ref: ${{ needs.setup_environment.outputs.target_branch }}
  #     - name: Set up environment
  #       run: |
  #         sudo apt-get update
  #         sudo apt-get install -y build-essential devscripts debhelper rpm
  #         sudo apt-get install -y cmake ninja-build curl coreutils dput dpkg
  #         sudo apt-get install -y python3-pip
  #         sudo pip3 install copr-cli
  #     - name: Run deploy script
  #       shell: bash
  #       run: |
  #         chmod +x auto_deploy.sh
  #         ./auto_deploy.sh --version ${{ needs.setup_environment.outputs.version }}
  #     - name: Upload Linux artifacts
  #       uses: actions/upload-artifact@v7
  #       with:
  #         name: linux-artifacts
  #         path: |
  #           *.deb
  #           *.rpm

  deploy_macos:
    needs: setup_environment
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup_environment.outputs.target_branch }}

      - name: Set up environment
        run: |
          if ! command -v brew &> /dev/null; then
            echo "Homebrew not found, please install Homebrew first."
            exit 1
          fi
          brew install cmake ninja coreutils

      - name: Run deploy script
        shell: bash
        run: |
          echo "Current branch: $(git rev-parse --abbrev-ref HEAD)"
          chmod +x auto_deploy.sh
          ./auto_deploy.sh --version ${{ needs.setup_environment.outputs.version }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts
          path: |
            *.rb

  deploy_windows:
    needs: setup_environment
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup_environment.outputs.target_branch }}

      - name: Set up environment
        run: |
          choco install cmake -y
          choco install ninja -y
          choco install curl -y
          choco install git -y

      - name: Run deploy script
        shell: bash
        run: |
          echo "Current branch: $(git rev-parse --abbrev-ref HEAD)"
          chmod +x auto_deploy.sh
          ./auto_deploy.sh --version ${{ needs.setup_environment.outputs.version }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: |
            *.nupkg

  finalize_deploy:
    needs: [setup_environment, deploy_macos, deploy_windows] # deploy_linux removed (v2.0.0 decision G3)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup_environment.outputs.target_branch }}

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-artifacts
          path: ./artifacts/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-artifacts
          path: ./artifacts/windows

      - name: Copy and rename changelog file
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p ./artifacts/temp
          if [ -f README.md ]; then cp README.md ./artifacts/temp/; fi
          if [ -f LICENSE ]; then cp LICENSE ./artifacts/temp/; fi
          if [ -f CHANGELOG.md ]; then cp CHANGELOG.md ./artifacts/temp/CHANGELOG-${{ needs.setup_environment.outputs.version }}.md; fi

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.ADI_DEPLOY_TOKEN }}
        run: |
          git config --global user.name "github-actions[deploy-bot]"
          git config --global user.email "github-actions[deploy-bot]@users.noreply.github.com"
          git checkout --orphan deploy
          git rm -rf .
          cp ./artifacts/macos/* .
          cp ./artifacts/windows/* .
          cp ./artifacts/temp/* .
          git add *.rb *.nupkg README.md LICENSE CHANGELOG-${{ needs.setup_environment.outputs.version }}.md
          git commit -m "Deploy version ${{ needs.setup_environment.outputs.version }}"
          git push origin deploy --force

  update_homebrew_formula:
    # needs setup_environment directly: job outputs do NOT transit through
    # finalize_deploy, so without this the commit message lost the version
    needs: [setup_environment, finalize_deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read   # push to the tap repo goes through the ADI_DEPLOY_TOKEN PAT
      actions: read    # download-artifact

    steps:
      - name: Checkout homebrew repository
        uses: actions/checkout@v4
        with:
          repository: Windsander/homebrew-ADI-Stable-Diffusion
          token: ${{ secrets.ADI_DEPLOY_TOKEN }}
          ref: main

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-artifacts
          path: ./artifacts/macos

      - name: Copy and commit homebrew formula
        run: |
          mkdir -p Formula
          cp ./artifacts/macos/*.rb Formula/
          cp README.md . 2>/dev/null || true
          git add Formula/*.rb
          git config --global user.name "github-actions[deploy-bot]"
          git config --global user.email "github-actions[deploy-bot]@users.noreply.github.com"
          git commit -m "Update Homebrew formula for version ${{ needs.setup_environment.outputs.version }}" || echo "no changes"
          git push origin main

  # Publish the nupkg produced by deploy_windows to the Chocolatey community
  # gallery. Requires the CHOCO_API_KEY repo secret (maintainer-owned account);
  # skips gracefully when the secret is not configured. First-time publishes
  # go through Chocolatey moderation before `choco install adi` works.
  publish_chocolatey:
    needs: [setup_environment, deploy_windows]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read    # download-artifact

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-artifacts
          path: ./artifacts/windows

      - name: Push to Chocolatey community gallery
        shell: bash
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if [ -z "$CHOCO_API_KEY" ]; then
            echo "WARNING: CHOCO_API_KEY not configured, skipping chocolatey.org publish"
            exit 0
          fi
          NUPKG=$(ls ./artifacts/windows/adi.*.nupkg | head -1)
          echo "Pushing $NUPKG (release ${{ needs.setup_environment.outputs.version }})"
          choco apikey --api-key "$CHOCO_API_KEY" --source https://push.chocolatey.org/
          choco push "$NUPKG" --source https://push.chocolatey.org/
