name: <Test> Native Compiling

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        platform: [ windows, linux, macos, android ]
        build_type: [ minsizerel ]
        arch: [ x86_64, aarch64, arm64, x86, arm64-v8a, armeabi-v7a ]
        include:
          - os: windows-latest
            platform: windows       # Platform: Windows (keep: x86_64, arm64; x86 dropped @ORT1.28)
            c_compiler: cl
            cpp_compiler: cl
          - os: macos-latest
            platform: macos         # Platform: MacOS (keep: arm64; x86_64 dropped @ORT1.28)
            c_compiler: clang
            cpp_compiler: clang++
          - os: ubuntu-latest
            platform: linux         # Platform: Linux (keep: x86_64, aarch64)
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            platform: android       # Platform: Android (keep: x86_64, x86, arm64-v8a, armeabi-v7a)
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          # Linux (keep: x86_64, aarch64)
          - platform: linux
            arch: arm64-v8a
          - platform: linux
            arch: armeabi-v7a
          - platform: linux
            arch: x86
          - platform: linux
            arch: arm64
          # macOS (keep: arm64; x86_64 dropped - ORT 1.28 prebuilt discontinued)
          - platform: macos
            arch: x86_64
          - platform: macos
            arch: arm64-v8a
          - platform: macos
            arch: armeabi-v7a
          - platform: macos
            arch: x86
          - platform: macos
            arch: aarch64
          # Windows (keep: x86_64, arm64; x86 dropped - ORT 1.28 prebuilt discontinued)
          - platform: windows
            arch: x86
          - platform: windows
            arch: arm64-v8a
          - platform: windows
            arch: armeabi-v7a
          - platform: windows
            arch: aarch64
          # Android (keep: x86_64, x86, arm64-v8a, armeabi-v7a)
          - platform: android
            arch: aarch64
          - platform: android
            arch: arm64
          # Exclude unsupported compiler combinations
          - os: windows-latest
            platform: linux
          - os: windows-latest
            platform: macos
          - os: ubuntu-latest
            platform: windows
          - os: ubuntu-latest
            platform: macos
          - os: macos-latest
            platform: windows
          - os: macos-latest
            platform: linux

    steps:
      - uses: actions/checkout@v4

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc g++ gcc-aarch64-linux-gnu g++-aarch64-linux-gnu patchelf

      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install dependencies on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # GitHub windows-latest images ship cmake+ninja preinstalled; only
          # fall back to choco when something is actually missing (choco 2.x
          # is no longer guaranteed on every windows image)
          cmake --version | head -1
          if ! command -v ninja >/dev/null 2>&1; then
            if command -v choco >/dev/null 2>&1; then
              choco install ninja -y
            else
              echo "ERROR: ninja unavailable and choco missing on this image"
              exit 1
            fi
          else
            ninja --version
          fi

      - name: Set up Android SDK and NDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v2
        with:
          api-level: 27
          ndk-version: 26.1.10909125
          cmake-version: 3.29.5

      - name: Enable MSVC environment (Windows, cl)
        if: runner.os == 'Windows' && matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run auto_build.sh
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "android" ]; then
            clang -print-targets
            bash ./auto_build.sh --platform android \
                                 --cmake "cmake" \
                                 --ninja "ninja" \
                                 --generator "Ninja" \
                                 --build-type ${{ matrix.build_type }} \
                                 --arch-abi ${{ matrix.arch }} \
                                 --jobs 4 \
                                 --android-ndk "$ANDROID_NDK_HOME" \
                                 --android-ver 27 \
                                 -c
          else
            bash ./auto_build.sh --platform ${{ matrix.platform }} \
                                 --cmake "cmake" \
                                 --ninja "ninja" \
                                 --generator "Ninja" \
                                 --build-type ${{ matrix.build_type }} \
                                 --arch-abi ${{ matrix.arch }} \
                                 --jobs 4 \
                                 -c
          fi

#      - name: Test
#        working-directory: ${{ steps.strings.outputs.build-output-dir }}
#        run: ctest --build-config ${{ matrix.build_type }}

  # Manual / on-demand inference smoke gate. Downloads the sd-turbo ONNX set
  # from HF (fast on runners) and runs the turbo slice of the smoke matrix
  # with hard gates (ORT exception count, output size, flat-pixel check).
  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc g++ cmake patchelf

      - name: Set up Python & fetch model
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download onnx-sd-turbo (~4.8GB from HF CDN)
        run: |
          pip install -q huggingface_hub pillow numpy
          python - <<'EOF'
          from huggingface_hub import snapshot_download
          p = snapshot_download(repo_id="Windsander/onnx-sd-turbo")
          print("model at:", p)
          EOF
          mkdir -p sd/sd-base-model
          ln -sfn "$(python -c 'from huggingface_hub import snapshot_download; print(snapshot_download(repo_id="Windsander/onnx-sd-turbo"))')" sd/sd-base-model/onnx-sd-turbo

      - name: Build adi (linux x86_64)
        run: |
          bash ./auto_build.sh --platform linux \
                               --cmake "cmake" \
                               --ninja "ninja" \
                               --generator "Ninja" \
                               --build-type minsizerel \
                               --arch-abi x86_64 \
                               --jobs 4 \
                               -c

      - name: Run turbo smoke matrix
        run: |
          bash sd/io-test/run_smoke_matrix.sh \
              cmake-build-minsizerel-linux-x86_64/bin/adi turbo