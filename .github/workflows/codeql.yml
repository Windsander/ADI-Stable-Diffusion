name: "Security · CodeQL"

# Replaces GitHub's default CodeQL setup: its C/C++ autobuild tries a full
# cmake build of this project (downloads ONNXRuntime, platform toolchains…)
# and always fails with "No supported build command succeeded".
# build-mode: none analyzes the source tree without compiling — the right
# fit for a cross-platform CMake project with a heavy build.
#
# Languages covered (so the default setup can be safely switched off):
#   cpp    — engine sources (codeql-config.yml)
#   python — ort_sd_py_imp.py & sd/tools (codeql-config-scripts.yml)
#   actions— .github/workflows (codeql-config-scripts.yml)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # weekly, Thursday 03:26 UTC (off-peak minute)
    - cron: '26 3 * * 4'

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: none
            config-file: ./.github/codeql/codeql-config.yml
          - language: python
            build-mode: none
            config-file: ./.github/codeql/codeql-config-scripts.yml
          - language: actions
            build-mode: none
            config-file: ./.github/codeql/codeql-config-scripts.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL (${{ matrix.language }})
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ${{ matrix.config-file }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
