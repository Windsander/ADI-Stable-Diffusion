name: 01 Auto publish packages (Release)

on:
  push:
    branches:
      - 'release/release-v*'

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version number
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/heads/release/release-}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Extracted version: $VERSION"

      - name: Create GitHub Release (if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if ! gh release view "release-${{ env.VERSION }}" >/dev/null 2>&1; then
            gh release create "release-${{ env.VERSION }}" --title "ADI ${{ env.VERSION }}" --notes-file CHANGELOG.md
          else
            echo "Release release-${{ env.VERSION }} already exists, skip creation."
          fi

  upload_assets:
    needs: create_release
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        platform: [ windows, linux, macos, android ]
        build_type: [ minsizerel ]
        arch: [ x86_64, aarch64, arm64, x86, arm64-v8a, armeabi-v7a ]
        include:
          - os: windows-latest
            platform: windows       # Platform: Windows (keep: x86_64, arm64; x86 dropped @ORT1.28)
            c_compiler: cl
            cpp_compiler: cl
          - os: macos-latest
            platform: macos         # Platform: MacOS (keep: arm64; x86_64 dropped @ORT1.28)
            c_compiler: clang
            cpp_compiler: clang++
          - os: ubuntu-latest
            platform: linux         # Platform: Linux (keep: x86_64, aarch64)
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            platform: android       # Platform: Android (keep: x86_64, x86, arm64-v8a, armeabi-v7a)
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          # Linux (keep: x86_64, aarch64)
          - platform: linux
            arch: arm64-v8a
          - platform: linux
            arch: armeabi-v7a
          - platform: linux
            arch: x86
          - platform: linux
            arch: arm64
          # macOS (keep: arm64; x86_64 dropped - ORT 1.28 prebuilt discontinued)
          - platform: macos
            arch: x86_64
          - platform: macos
            arch: arm64-v8a
          - platform: macos
            arch: armeabi-v7a
          - platform: macos
            arch: x86
          - platform: macos
            arch: aarch64
          # Windows (keep: x86_64, arm64; x86 dropped - ORT 1.28 prebuilt discontinued)
          - platform: windows
            arch: x86
          - platform: windows
            arch: arm64-v8a
          - platform: windows
            arch: armeabi-v7a
          - platform: windows
            arch: aarch64
          # Android (keep: x86_64, x86, arm64-v8a, armeabi-v7a)
          - platform: android
            arch: aarch64
          - platform: android
            arch: arm64
          # Exclude unsupported compiler combinations
          - os: windows-latest
            platform: linux
          - os: windows-latest
            platform: macos
          - os: windows-latest
            platform: android
          - os: ubuntu-latest
            platform: windows
          - os: ubuntu-latest
            platform: macos
          - os: macos-latest
            platform: windows
          - os: macos-latest
            platform: linux
          - os: macos-latest
            platform: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Extract version from branch name
        id: extract_version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/heads/release/release-}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Extracted version: $VERSION"

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip tar
          sudo apt-get install -y gcc g++ gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ninja zip

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install cmake ninja zip -y

      - name: Set up Android SDK and NDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v4
        with:
          api-level: 27
          ndk-version: 26.1.10909125
          cmake-version: 3.29.5

      - name: Enable MSVC environment (Windows, cl)
        if: matrix.os == 'windows-latest' && matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build project (Linux, macOS, Windows)
        if: matrix.platform != 'android'
        shell: bash
        run: |
          bash ./auto_build.sh --platform ${{ matrix.platform }} \
                               --generator "Ninja" \
                               --build-type ${{ matrix.build_type }} \
                               --arch-abi ${{ matrix.arch }} \
                               -c

      - name: Build project (Android)
        if: matrix.platform == 'android'
        shell: bash
        run: |
          bash ./auto_build.sh --platform android \
                               --cmake "cmake" \
                               --ninja "ninja" \
                               --generator "Ninja" \
                               --build-type ${{ matrix.build_type }} \
                               --arch-abi ${{ matrix.arch }} \
                               --jobs 4 \
                               --android-ndk "$ANDROID_NDK_HOME" \
                               --android-ver 27 \
                               -c

      - name: Create release directory
        shell: bash
        run: |
          mkdir -p release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Copy files to release directory
        shell: bash
        run: |
          cp -r include release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}/
          cp -r cmake-build-${{ matrix.build_type }}-${{ matrix.platform }}-${{ matrix.arch }}/bin release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}/
          cp -r cmake-build-${{ matrix.build_type }}-${{ matrix.platform }}-${{ matrix.arch }}/lib release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}/
          cp CHANGELOG.md release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}/
          cp README.md release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}/
          cp LICENSE release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}/

      - name: Create zip archive (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          tar -czvf release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Create zip archive (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          tar -czvf release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Create zip archive (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          zip -r release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.zip release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Create zip archive (Android)
        if: matrix.platform == 'android'
        shell: bash
        run: |
          zip -r release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.zip release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Generate checksum entry
        shell: bash
        run: |
          mkdir -p checksums
          archive=$(ls release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz 2>/dev/null || ls release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.zip)
          name=$(basename "$archive")
          if command -v sha256sum >/dev/null 2>&1; then
            sum=$(sha256sum "$archive" | awk '{print $1}')
          else
            sum=$(shasum -a 256 "$archive" | awk '{print $1}')
          fi
          echo "$sum  $name" | tee "checksums/${{ matrix.platform }}-${{ matrix.arch }}.txt"

      - name: Upload checksum fragment
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.platform }}-${{ matrix.arch }}
          path: checksums/

      - name: Upload release asset (Linux)
        if: matrix.platform == 'linux'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ env.VERSION }}
          files: release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          fail_on_unmatched_files: true

      - name: Upload release asset (macOS)
        if: matrix.platform == 'macos'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ env.VERSION }}
          files: release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          fail_on_unmatched_files: true

      - name: Upload release asset (Windows)
        if: matrix.platform == 'windows'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ env.VERSION }}
          files: release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.zip
          fail_on_unmatched_files: true

      - name: Upload release asset (Android)
        if: matrix.platform == 'android'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ env.VERSION }}
          files: release-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.zip
          fail_on_unmatched_files: true

  # Merge every matrix leg's checksum fragment into a single SHA256SUMS.txt
  # and attach it to the release, so users (and auto_deploy.sh) can verify
  # artifact integrity without re-downloading to hash.
  publish_checksums:
    needs: upload_assets
    runs-on: ubuntu-latest

    steps:
      - name: Extract version from branch name
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/heads/release/release-}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download checksum fragments
        uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          path: checksums
          merge-multiple: true

      - name: Merge & sort into SHA256SUMS.txt
        shell: bash
        run: |
          sort checksums/*.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ env.VERSION }}
          files: SHA256SUMS.txt
          fail_on_unmatched_files: true
